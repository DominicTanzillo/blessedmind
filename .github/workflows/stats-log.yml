name: Weekly Stats Log

# Pulls accumulated progress from Supabase once a week and commits a
# changelog (STATS.md + stats/history.jsonl). The weekly commit also keeps
# the repo active, which stops GitHub from auto-disabling scheduled workflows.
on:
  schedule:
    - cron: '0 7 * * 1'   # Mondays 07:00 UTC (after the 06:00 keep-alive)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Collect stats from Supabase
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          # Service role, not anon: the tables now require a signed-in session,
          # and this job has no user to sign in as.
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/collect-stats.mjs

      - name: Commit changelog
        run: |
          git config user.name "stats-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATS.md stats/history.jsonl
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: weekly progress stats ($(date -u +%Y-%m-%d))"
            git push
          fi
