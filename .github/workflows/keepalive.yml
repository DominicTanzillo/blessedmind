name: Supabase Keep-Alive

# Free-tier Supabase projects pause after ~7 days of inactivity.
# This pings the REST API a couple times a week to keep it awake.
on:
  schedule:
    - cron: '0 6 * * 1,4'   # 06:00 UTC every Monday and Thursday (max gap ~4 days)
  workflow_dispatch:          # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          echo "Pinging $SUPABASE_URL ..."
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/tasks?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP status: $code"
          if [ "$code" != "200" ]; then
            echo "::error::Keep-alive ping failed (expected 200, got $code)"
            exit 1
          fi
          echo "Project is awake."
